<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HND Student Information</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>HND Student Information</h2>
        
        <form id="hndForm" novalidate>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>

            <div class="form-group">
                <label for="surname">Surname:</label>
                <input type="text" id="surname" name="surname">
            </div>

            <div class="form-group">
                <label for="birthdate">Birth date <i>formatted as dd/mm/yyyy</i></label>
                <input type="text" id="birthdate" name="birthdate" placeholder="jj/mm/aaaa">
            </div>

            <div class="form-group">
                <label for="placeofbirth">Place of birth :</label>
                <input type="text" id="placeofbirth" name="placeofbirth">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number :</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <button type="submit">submit</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
